version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # 公開直後のバージョンには飛びつかない（pnpm の minimumReleaseAge と同じ趣旨）
    cooldown:
      default-days: 7
    groups:
      dev:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
