<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ミュージックサイレン再現（非公式）</title>
    <style>
      :root { color-scheme: light dark; }
      body { font-family: system-ui, sans-serif; margin: 1.5rem; max-width: 60rem; }
      h1 { font-size: 1.4rem; }
      small { opacity: 0.7; }
      fieldset { border: 1px solid #8884; border-radius: 6px; margin: 0 0 1rem; }
      button { font: inherit; padding: 0.4rem 0.9rem; border-radius: 6px; border: 1px solid #8886; background: #8882; cursor: pointer; }
      button:active, button.down { background: #d9a52a; color: #000; }
      button:disabled { opacity: 0.4; cursor: default; }
      #keys { display: flex; gap: 0.4rem; flex-wrap: wrap; }
      #keys button { min-width: 4.2rem; text-align: center; user-select: none; touch-action: none; }
      #keys button b { display: block; font-size: 1.2rem; }
      #keys button i { display: block; font-size: 0.75rem; font-style: normal; opacity: 0.7; }
      #readout { font-variant-numeric: tabular-nums; }
      table { border-collapse: collapse; }
      th, td { border: 1px solid #8886; padding: 0.2rem 0.6rem; text-align: right; font-variant-numeric: tabular-nums; }
      th { background: #8882; }
      td:first-child, th:first-child { text-align: left; }
      meter { width: 6rem; }
      #tuning { display: grid; grid-template-columns: repeat(auto-fit, minmax(22rem, 1fr)); gap: 0 1.5rem; margin-top: 0.5rem; }
      .tuning-group h3 { font-size: 0.9rem; margin: 0.6rem 0 0.2rem; }
      .tuning-row { display: grid; grid-template-columns: 11rem 1fr 5.5rem; gap: 0.5rem; align-items: center; font-size: 0.85rem; padding: 0.1rem 0.3rem; border-radius: 4px; }
      .tuning-row.changed { background: #d9a52a33; }
      .tuning-row input[type=number] { font: inherit; width: 100%; box-sizing: border-box; text-align: right; }
      .tuning-buttons { grid-column: 1 / -1; display: flex; gap: 0.5rem; margin-top: 0.8rem; }
      #tuning > small { grid-column: 1 / -1; margin-top: 0.3rem; }
      .tuning-output { grid-column: 1 / -1; background: #8882; border-radius: 6px; padding: 0.5rem 0.8rem; font-size: 0.8rem; max-height: 14rem; overflow: auto; user-select: all; }
    </style>
  </head>
  <body>
    <h1>ミュージックサイレン再現</h1>
    <p><small>個人の趣味プロジェクト。非公式で、ヤマハとは無関係です。</small></p>

    <fieldset>
      <legend>機械</legend>
      <label>機種 <select id="preset"></select></label>
      <label>電源 <select id="supply"><option value="60">60 Hz</option><option value="50">50 Hz</option></select></label>
    </fieldset>

    <fieldset>
      <legend>運転</legend>
      <label>曲 <select id="song"></select></label>
      <button id="auto">AUT（自動演奏）</button>
      <button id="start">START（HAND）</button>
      <button id="stop" disabled>STOP</button>
      <span id="readout">停止中</span>
    </fieldset>

    <fieldset>
      <legend>デバッグ</legend>
      <button id="snap-steady" title="モーターを一瞬で定常回転にする。AUT の起動待ち中なら、すぐ演奏に入る">即時定常 100%</button>
      <button id="snap-stop" title="回転を 0 にし、全カバーを閉じ、AUT も止める">即時停止</button>
    </fieldset>

    <fieldset>
      <legend>鍵盤（押している間だけ開閉カバーが開く。キーボードは低い音から A S D F G H J K L ; ' ]）</legend>
      <div id="keys"></div>
    </fieldset>

    <fieldset>
      <legend>音の調整</legend>
      <details>
        <summary>パラメータを開く（鳴らしながら動かせる）</summary>
        <div id="tuning"></div>
      </details>
    </fieldset>

    <fieldset>
      <legend>3D（ドラッグで回転、ホイールで拡大）</legend>
      <label><input type="checkbox" id="building" /> 建屋を表示</label>
      <label><input type="checkbox" id="seethrough" /> サイレン本体を透かす</label>
      <label><input type="checkbox" id="housings" /> マグネットカバー・ブレーキカバー・歯車箱を外す</label>
      <label><input type="checkbox" id="section" /> 断面</label>
      <canvas id="view" style="display:block; width:100%; aspect-ratio: 16/9; border-radius: 6px; margin-top: 0.5rem;"></canvas>
    </fieldset>

    <details>
      <summary>配列表の公称値（機構モデルから再現）</summary>
      <div id="tables"></div>
    </details>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
