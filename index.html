<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ミュージックサイレン再現（非公式）</title>
    <style>
      :root { color-scheme: light dark; }
      body { font-family: system-ui, sans-serif; margin: 1.5rem; max-width: 60rem; }
      h1 { font-size: 1.4rem; }
      small { opacity: 0.7; }
      fieldset { border: 1px solid #8884; border-radius: 6px; margin: 0 0 1rem; }
      button { font: inherit; padding: 0.4rem 0.9rem; border-radius: 6px; border: 1px solid #8886; background: #8882; cursor: pointer; }
      button:active, button.down { background: #d9a52a; color: #000; }
      button:disabled { opacity: 0.4; cursor: default; }
      #keys { display: flex; gap: 0.4rem; flex-wrap: wrap; }
      #keys button { min-width: 4.2rem; text-align: center; user-select: none; touch-action: none; }
      #keys button b { display: block; font-size: 1.2rem; }
      #keys button i { display: block; font-size: 0.75rem; font-style: normal; opacity: 0.7; }
      #readout { font-variant-numeric: tabular-nums; }
      table { border-collapse: collapse; }
      th, td { border: 1px solid #8886; padding: 0.2rem 0.6rem; text-align: right; font-variant-numeric: tabular-nums; }
      th { background: #8882; }
      td:first-child, th:first-child { text-align: left; }
      meter { width: 6rem; }
    </style>
  </head>
  <body>
    <h1>ミュージックサイレン再現</h1>
    <p><small>個人の趣味プロジェクト。非公式で、ヤマハとは無関係です。</small></p>

    <fieldset>
      <legend>機械</legend>
      <label>機種 <select id="preset"></select></label>
      <label>電源 <select id="supply"><option value="60">60 Hz</option><option value="50">50 Hz</option></select></label>
    </fieldset>

    <fieldset>
      <legend>運転</legend>
      <button id="start">START</button>
      <button id="stop" disabled>STOP</button>
      <span id="readout">停止中</span>
    </fieldset>

    <fieldset>
      <legend>鍵盤（押している間だけ開閉カバーが開く。キーボードは低い音から A S D F G H J K L ; ' ]）</legend>
      <div id="keys"></div>
    </fieldset>

    <details>
      <summary>配列表の公称値（機構モデルから再現）</summary>
      <div id="tables"></div>
    </details>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
